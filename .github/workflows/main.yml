---
name: CI

on:
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Built from the same Dockerfile the Publish workflow and local
      # development use, so validation cannot drift from what gets published.
      # It also carries WeasyPrint's native libraries, which the PDF export
      # plugin needs and a minimal container does not have.
      - name: Build the mkdocs image
        run: docker build -t mkdocs-build -f ./dev/Dockerfile .

      - name: Spell check and build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/site" \
            --entrypoint sh \
            mkdocs-build -c "cd /site && npm ci --silent && ./node_modules/.bin/cspell 'docs/**/*.md' && mkdocs build --strict"
