site_name: terraPen Documentation
site_description: >-
  Documentation for the open source terraPen plotter
docs_dir: docs
site_dir: public
site_url: !ENV [SITE_URL, 'http://localhost:8000']
theme: 
  name: material
  logo: img/TP-Logo-web-ad.svg
  favicon: img/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: lime
      accent: green
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: lime
      accent: green
  font:
    # text: Open Sans
    text: Jura
    code: Roboto Mono
  language: en
  features:
    # - announce.dismiss
    - content.code.copy
    - content.code.annotate
    # - content.tabs.link
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
use_directory_urls: true
plugins:
  - tags
  - social
  - privacy
  - minify:
      minify_html: true
  # Produces a single downloadable PDF of the whole guide at pdf/terraPen-guide.pdf
  - pdf-export:
      combined: true
      combined_output_path: pdf/terraPen-guide.pdf
      verbose: false
  - search:
      # Split on punctuation and at camelCase boundaries, so a search for
      # "forge" finds terraForge and "plot" finds 1stPlot.
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
copyright: Copyright © 2024 The Work is the work
extra:
  generator: false
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/fEXrmUm5nR
    - icon: fontawesome/brands/html5
      link: https://www.terrapen.xyz/
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/theworkisthe.work/
    - icon: fontawesome/brands/github
      link: https://github.com/theworkisthework
nav:
  - Home: index.md
  - Getting started:
      - Safety: safety.md
      - What's in the box: WhatsInTheBox.md
      - Fitting the toolhead: assembly.md
      - First time setup: 1sttimeuse.md
      - The web UI: terraPenWebUI.md
  - Your first plot:
      - Your first plot: 1stPlot.md
      - Moving the pen carriage: movingThePenCarriage.md
      - Plotting area and paper: plotting.md
      - Starting a plot: startingAplot.md
  - Making artwork:
      - terraForge: terraForge.md
      - Uploading files: uploadingFiles.md
      - Lightburn profiles and settings: LightburnProfilesAndSettings.md
      - Cutting vinyl: vinyl.md
  - Older machines:
      - Solenoid pen lift: solenoid.md
  - Connecting:
      - Connect to your own Wi-Fi: connectToPersonalNetwork.md
      - Connect via USB-C: ConnectTethered.md
      - Restarting the terraPen: restartTerraPen.md
  - Looking after it:
      - Maintenance: maintenance.md
      - Transport and storage: transport.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Getting support: support.md
      - FAQ: FAQ.md
      - Specifications: specifications.md
      - YAML configuration settings: YAMLConfigurationSettings.md
      - Hardware and source files: hardware.md
